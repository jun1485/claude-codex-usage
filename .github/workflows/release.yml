name: Release Extension

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.3.5)"
        required: true
        type: string
      skip_marketplace:
        description: "Skip VS Code Marketplace publishing"
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify tag matches package version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$RELEASE_TAG" ]; then
            echo "Tag $RELEASE_TAG does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Package extension
        id: package
        run: npx vsce package --out extension.vsix
      - name: Publish to VS Code Marketplace
        if: ${{ !inputs.skip_marketplace }}
        run: npx --yes @vscode/vsce@4.1.1 publish --packagePath extension.vsix --oidc --skip-duplicate
      - name: Publish to Open VSX
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: npx --yes ovsx publish extension.vsix -p "$OVSX_PAT" --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Create GitHub Release
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
          gh release create "$RELEASE_TAG" extension.vsix \
            --title "$RELEASE_TAG" \
            --notes "Install from the [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=jjju.claude-codex-usage-monitor), [Open VSX](https://open-vsx.org/extension/jjju/claude-codex-usage-monitor), or [Windsurf Marketplace](https://marketplace.windsurf.com/extension/jjju/claude-codex-usage-monitor)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
